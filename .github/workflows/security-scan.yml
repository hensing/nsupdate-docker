name: Weekly Security Scan

on:
  schedule:
    - cron: '0 5 * * 0' # Runs every Sunday at 5 AM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable = PyPI release, dev = upstream master (also tagged latest).
        tag: [stable, dev]
    permissions:
      contents: read # for actions/checkout
      packages: read # for docker/login-action
      security-events: write # for github/codeql-action/upload-sarif
      actions: write # for triggering rebuild workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          format: spdx-json
          output-file: "${{ github.event.repository.name }}-sbom.spdx.json"
          artifact-name: "${{ github.event.repository.name }}-${{ matrix.tag }}-sbom.spdx.json"

      - name: Scan SBOM
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          sbom: "${{ github.event.repository.name }}-sbom.spdx.json"
          fail-build: false
          # Wolfi base keeps CVE counts near zero, so we can gate on high+.
          severity-cutoff: high
          output-format: "sarif"
          output-file: "grype-results.sarif"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: 'grype-results.sarif'
          category: grype-${{ matrix.tag }}

      - name: Check for critical vulnerabilities
        id: vulncheck
        run: |
          CRITICAL_COUNT=$(jq -r '.runs[0].tool.driver.rules[] | select(.properties.security-severity | tonumber >= 9.0) | .id' grype-results.sarif \
            | sort | uniq > critical_rules.txt \
            && jq -r '.runs[0].results[].ruleId' grype-results.sarif | grep -cf critical_rules.txt || echo 0)
          echo "count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger rebuild to fix vulnerabilities
        if: steps.vulncheck.outputs.found == 'true'
        run: gh workflow run docker-publish.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail if critical vulnerabilities remain
        if: steps.vulncheck.outputs.found == 'true'
        run: |
          echo "::error::${{ steps.vulncheck.outputs.count }} critical vulnerability/ies found — rebuild triggered, check docker-publish workflow for result."
          exit 1
