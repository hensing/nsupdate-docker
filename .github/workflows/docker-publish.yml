name: Docker CI

on:
  push:
    branches:
      - main
  # Pull requests (incl. Dependabot bumps) are tested, built, smoke-tested and
  # scanned, but never logged in to the registry or pushed.
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 4 * * 0' # rebuild every sunday night

# Least privilege by default; jobs opt in to what they need.
permissions:
  contents: read

# Never let two runs for the same ref push tags at the same time. Runs are
# queued rather than cancelled so a push is never interrupted half-way.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image for testing
        run: docker build --build-arg BUILD_TARGET=test -t nsupdate-test .

      - name: Install and configure BIND for DoH/DoT
        run: |
          sudo apt-get -y update
          sudo apt-get -y install bind9 bind9-dnsutils openssl

          sudo openssl req -x509 -nodes -days 30 -newkey rsa:2048 \
            -keyout /etc/bind/nsupdate.info.key \
            -out /etc/bind/nsupdate.info.crt \
            -subj "/CN=localhost"
          sudo chown bind:bind /etc/bind/nsupdate.info.key /etc/bind/nsupdate.info.crt
          sudo chmod 600 /etc/bind/nsupdate.info.key

          sudo tee /etc/bind/named.conf.options > /dev/null << 'NAMED_OPTIONS'
          tls local-tls {
            cert-file "/etc/bind/nsupdate.info.crt";
            key-file "/etc/bind/nsupdate.info.key";
          };
          http local-http {
            endpoints { "/dns-query"; };
          };
          options {
            directory "/var/cache/bind";
            listen-on port 53  { any; };
            listen-on port 853 tls local-tls { any; };
            listen-on port 443 tls local-tls http local-http { any; };
            forwarders { 8.8.8.8; };
            dnssec-validation auto;
          };
          NAMED_OPTIONS

          sudo tee /etc/bind/named.conf.local > /dev/null << 'NAMED_LOCAL'
          key "nsupdate.info." {
            algorithm hmac-sha512;
            secret "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==";
          };
          key "tests.nsupdate.info." {
            algorithm hmac-sha512;
            secret "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==";
          };
          zone "nsupdate.info" {
            type master;
            file "/var/lib/bind/nsupdate.info";
            update-policy {
              deny  nsupdate.info. name      nsupdate.info;
              deny  nsupdate.info. name  www.nsupdate.info;
              deny  nsupdate.info. name ipv4.nsupdate.info;
              deny  nsupdate.info. name ipv6.nsupdate.info;
              grant nsupdate.info. name connectivity-test.nsupdate.info A;
              grant nsupdate.info. subdomain nsupdate.info;
            };
          };
          zone "tests.nsupdate.info" {
            type master;
            file "/var/lib/bind/tests.nsupdate.info";
            update-policy {
              deny  tests.nsupdate.info. name      tests.nsupdate.info;
              deny  tests.nsupdate.info. name  www.tests.nsupdate.info;
              deny  tests.nsupdate.info. name ipv4.tests.nsupdate.info;
              deny  tests.nsupdate.info. name ipv6.tests.nsupdate.info;
              grant tests.nsupdate.info. subdomain tests.nsupdate.info;
            };
          };
          NAMED_LOCAL

          sudo tee /var/lib/bind/nsupdate.info > /dev/null << 'ZONE1'
          $ORIGIN .
          $TTL 3600
          nsupdate.info IN SOA ns1.nsupdate.info. root.nsupdate.info. (
            2016081401 7200 1800 604800 60 )
            NS 127.0.0.1.
            A  127.0.0.1
          $ORIGIN nsupdate.info.
          ipv4 A    1.2.3.4
          ipv6 AAAA ::1
          www  A    1.2.3.4
          ZONE1

          sudo tee /var/lib/bind/tests.nsupdate.info > /dev/null << 'ZONE2'
          $ORIGIN .
          $TTL 3600
          tests.nsupdate.info IN SOA ns1.tests.nsupdate.info. root.tests.nsupdate.info. (
            2016081401 7200 1800 604800 60 )
            NS 127.0.0.1.
            A  127.0.0.1
          $ORIGIN tests.nsupdate.info.
          ipv4 A    1.2.3.4
          ipv6 AAAA ::1
          www  A    1.2.3.4
          ZONE2

          sudo chown bind:bind /var/lib/bind/nsupdate.info /var/lib/bind/tests.nsupdate.info
          sudo named-checkconf
          sudo service bind9 restart
          sleep 2
          dig @127.0.0.1 tests.nsupdate.info SOA

      - name: Run Pytest
        # We run pytest directly as the test runner, as the project's tests
        # are written for pytest. We also set the DJANGO_SETTINGS_MODULE
        # explicitly to ensure the correct settings are used for the test run.
        # --network host lets the container reach BIND on 127.0.0.1 (DoH/DoT tests).
        # The image runs as the non-root user; set HOME to a writable path so
        # pytest's cache and any tooling have somewhere to write.
        run: >
          docker run --rm --entrypoint=""
          --network host
          -e HOME=/tmp
          -e DJANGO_SETTINGS_MODULE=nsupdate.settings.dev
          -e DJANGO_SUPERUSER_PASSWORD=ci-test-password
          nsupdate-test pytest --ignore=src/nsupdate/api/_tests/test_api.py --ignore=src/nsupdate/main/_tests/test_dnstools.py

  # Two image variants are published:
  #   stable -> the nsupdate release from PyPI pinned in requirements/stable.txt.
  #             Tags: stable, <release version> (e.g. 0.13.0)
  #   dev    -> upstream GitHub master, built from the exact commit resolved below.
  #             Tags: dev, latest, main, dev-<upstream short sha> (e.g. dev-1a2b3c4)
  # "latest" stays on the master build, as it always was, so existing
  # deployments that pull "latest" keep getting the same thing.
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            source: pypi
          - variant: dev
            source: git
    permissions:
      contents: read
      packages: write
      security-events: write # for github/codeql-action/upload-sarif

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the upstream version
        id: upstream
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          if [ "$SOURCE" = "pypi" ]; then
            # The release pinned in requirements/stable.txt (bumped by Dependabot).
            VERSION=$(sed -n 's/^nsupdate==\([0-9][0-9.]*\)[[:space:]]*$/\1/p' requirements/stable.txt)
            if [ -z "$VERSION" ]; then
              echo "::error::No 'nsupdate==<version>' pin found in requirements/stable.txt"
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "label=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Building nsupdate $VERSION from PyPI"
          else
            # Resolve master to a commit so the image and its dev-<sha> tag
            # refer to exactly the same upstream revision.
            SHA=$(git ls-remote https://github.com/nsupdate-info/nsupdate.info.git refs/heads/master | cut -f1)
            if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Could not resolve upstream master (got '$SHA')"
              exit 1
            fi
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "label=dev-${SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "Building nsupdate.info master at $SHA"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=stable,enable=${{ matrix.variant == 'stable' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'dev' }}
            type=raw,value=${{ steps.upstream.outputs.version }},enable=${{ matrix.variant == 'stable' }}
            type=raw,value=dev,enable=${{ matrix.variant == 'dev' }}
            type=raw,value=dev-${{ steps.upstream.outputs.short }},enable=${{ matrix.variant == 'dev' }}
            type=ref,event=branch,enable=${{ matrix.variant == 'dev' }}
          labels: |
            org.opencontainers.image.version=${{ steps.upstream.outputs.label }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          build-args: |
            NSUPDATE_SOURCE=${{ matrix.source }}
            NSUPDATE_REF=${{ steps.upstream.outputs.ref || 'master' }}

      - name: Smoke test (container starts and answers HTTP)
        # Runs with the same hardening as compose.yaml, so a change that needs
        # a writable rootfs or a capability fails here instead of in production.
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ matrix.variant }}
        run: |
          docker run -d --name smoke \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e SECRET_KEY=ci-smoke-test-key \
            -e DJANGO_SUPERUSER_PASSWORD=ci-test-password \
            "$IMAGE"
          STATUS=starting
          for _ in $(seq 60); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo gone)
            [ "$STATUS" = "starting" ] || break
            sleep 3
          done
          docker logs smoke
          docker exec smoke django-admin version || true
          docker rm -f smoke
          if [ "$STATUS" != "healthy" ]; then
            echo "::error::Smoke test failed: container health is '$STATUS'"
            exit 1
          fi

      - name: Create SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:${{ matrix.variant }}
          format: spdx-json
          output-file: "${{ github.event.repository.name }}-sbom.spdx.json"
          artifact-name: "${{ github.event.repository.name }}-${{ matrix.variant }}-sbom.spdx.json"

      - name: Scan SBOM
        id: scan
        uses: anchore/scan-action@v7
        continue-on-error: true
        with:
          sbom: "${{ github.event.repository.name }}-sbom.spdx.json"
          fail-build: false
          # Wolfi base keeps CVE counts near zero, so we can gate on high+.
          severity-cutoff: high
          output-format: "sarif"
          output-file: "grype-results.sarif"

      - name: Check SARIF exists
        id: sarifcheck
        run: |
          if [ -f grype-results.sarif ]; then echo "found=true" >> $GITHUB_OUTPUT; else echo "found=false" >> $GITHUB_OUTPUT; fi

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-results-${{ matrix.variant }}
          path: grype-results.sarif

      - name: Upload vulnerability report to Security tab
        # Not on pull requests: fork/Dependabot PRs get a read-only token.
        if: steps.sarifcheck.outputs.found == 'true' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'grype-results.sarif'
          category: grype-${{ matrix.variant }}

      - name: Fail on critical vulnerabilities
        if: steps.sarifcheck.outputs.found == 'true'
        run: |
          # We report High+ to the Security tab (severity-cutoff: high) for visibility,
          # but only *fail* the build on Critical (CVSS >= 9.0). Rationale: even Wolfi
          # occasionally carries a transient High in a fast-moving base package (e.g. the
          # Python interpreter) before an upstream fix lands; the weekly rebuild picks the
          # fix up automatically, so gating pushes on High would block for no actionable reason.
          CRITICAL_COUNT=$(jq -r '.runs[0].tool.driver.rules[] | select(.properties.security-severity | tonumber >= 9.0) | .id' grype-results.sarif | sort | uniq > critical_rules.txt && jq -r '.runs[0].results[].ruleId' grype-results.sarif | grep -f critical_rules.txt | wc -l || echo 0)

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "$CRITICAL_COUNT critical vulnerabilities detected in SARIF."
            exit 1
          else
            echo "No critical vulnerabilities found in SARIF."
          fi

      - name: Push Docker image
        # Only main publishes. A pull request or a manual run on another
        # branch builds, tests and scans, but must never move the public tags.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push --all-tags ghcr.io/${{ github.repository }}
